name: PR housekeeping

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  issues: write

jobs:
  assign-owner:
    name: Assign PR to owner
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Assign 2biazdk
        uses: actions/github-script@v7
        with:
          script: |
            const assignee = '2biazdk';
            const pr = context.payload.pull_request;

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [assignee],
              });
            } catch (error) {
              core.warning(`Could not assign ${assignee}: ${error.message}`);
            }
