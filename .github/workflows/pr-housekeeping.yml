name: PR housekeeping

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  assign-owner:
    name: Assign PR to owner
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Assign 2biazdk
        uses: actions/github-script@v9
        with:
          script: |
            const assignee = '2biazdk';
            const pr = context.payload.pull_request;

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [assignee],
              });
            } catch (error) {
              core.warning(`Could not assign ${assignee}: ${error.message}`);
            }

  delete-merged-branch:
    name: Delete merged PR branch
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete source branch
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const protectedBranches = new Set([
              pr.base.ref,
              pr.base.repo.default_branch,
              'main',
              'master',
            ].filter(Boolean));

            if (pr.head.repo.full_name !== pr.base.repo.full_name) {
              core.info('Skipping branch deletion for a forked pull request.');
              return;
            }

            if (protectedBranches.has(branch)) {
              core.info(`Skipping protected branch ${branch}.`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted source branch ${branch}.`);
            } catch (error) {
              if ([404, 422].includes(error.status)) {
                core.notice(`Branch ${branch} was already deleted or could not be deleted.`);
                return;
              }

              throw error;
            }
