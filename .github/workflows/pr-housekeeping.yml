name: PR housekeeping

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  assign-author:
    name: Assign PR author
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Assign author
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                assignees: [author]
              });
            } catch (error) {
              core.warning(`Could not assign ${author}: ${error.message}`);
            }

  delete-closed-branch:
    name: Delete closed PR branch
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Delete branch
        uses: actions/github-script@v7
        with:
          script: |
            const ref = `heads/${context.payload.pull_request.head.ref}`;

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.warning(`Could not delete ${ref}: ${error.message}`);
                return;
              }

              throw error;
            }
