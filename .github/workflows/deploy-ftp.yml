name: Deploy to FTP

on:
  workflow_run:
    workflows:
      - Tests
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ftp-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload FTP build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://colorcontrast.forlaens.com
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: gd

      - name: Install dependencies
        run: npm ci

      - name: Build FTP package
        run: npm run build

      - name: Verify FTP package
        run: |
          test -d dist
          find dist -maxdepth 2 -type f | sort | head -50

      - name: Check FTP secrets
        id: ftp-config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_SERVER_DIR" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP deploy skipped because one or more FTP secrets are missing."
          fi

      - name: Install lftp
        if: steps.ftp-config.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload files
        if: steps.ftp-config.outputs.enabled == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow true
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --delete --verbose dist "$FTP_SERVER_DIR"
          bye
          EOF
