name: Deploy to production

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-colorcontrast-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://colorcontrast.forlaens.com
    if: >
      github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: gd

      - name: Install dependencies
        run: npm ci

      - name: Build production package
        run: npm run build

      - name: Verify production package
        run: |
          test -d dist
          find dist -maxdepth 2 -type f | sort | head -50

      - name: Publish static release
        env:
          DEPLOY_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release_dir="$RUNNER_TEMP/colorcontrast-release"
          install -d "$release_dir"
          cp -R dist/. "$release_dir/"
          printf '%s\n' "$DEPLOY_SOURCE_SHA" > "$release_dir/.deploy-sha"
          git -C "$release_dir" init --initial-branch=colorcontrast-production
          git -C "$release_dir" config user.name 'github-actions[bot]'
          git -C "$release_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$release_dir" add --all
          git -C "$release_dir" commit -m "Publish ColorContrast $DEPLOY_SOURCE_SHA"
          git -C "$release_dir" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$release_dir" push --force origin colorcontrast-production

      - name: Verify live site
        env:
          DEPLOY_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          for attempt in $(seq 1 24); do
            live_sha="$(curl --fail --silent --show-error --max-time 10 https://colorcontrast.forlaens.com/.deploy-sha || true)"
            if [ "$live_sha" = "$DEPLOY_SOURCE_SHA" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done
          echo 'The live site did not receive the expected release.' >&2
          exit 1
