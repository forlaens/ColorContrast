name: Deploy to production

on:
  workflow_run:
    workflows:
      - Tests
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-colorcontrast-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://colorcontrast.forlaens.com
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: gd

      - name: Install dependencies
        run: npm ci

      - name: Build production package
        run: npm run build

      - name: Verify production package
        run: |
          test -d dist
          find dist -maxdepth 2 -type f | sort | head -50

      - name: Configure restricted SSH deployment
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_COLORCONTRAST_DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/colorcontrast_deploy"
          chmod 600 "$HOME/.ssh/colorcontrast_deploy"
          printf '%s\n' '2.28.78.95 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNkQnGVw2OTZX30yZTiiAdtzlo2llh1KEnkCtbCGD0/' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload static files to Hetzner
        run: |
          rsync -rlptDz --delete --itemize-changes \
            -e 'ssh -i ~/.ssh/colorcontrast_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            dist/ deploy-colorcontrast@2.28.78.95:/srv/www/colorcontrast.2biaz.dk/public/

      - name: Verify live site
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            https://colorcontrast.forlaens.com/ -o /dev/null
