name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Source check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd

      - name: Install dependencies
        run: npm ci

      - name: Run source checks
        run: npm run check

  build:
    name: Build app
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  structure:
    name: Structure and HTML tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run structure tests
        run: npm run test:structure

      - name: Run HTML validation
        run: npm run test:html

  accessibility:
    name: Accessibility tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:accessibility

  upload-reports:
    name: Upload test reports
    runs-on: ubuntu-latest
    needs: [check, build, structure, accessibility]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  required-status:
    name: Check, build, and test
    runs-on: ubuntu-latest
    needs: [check, build, structure, accessibility]
    if: always()

    steps:
      - name: Confirm required checks passed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.entries(needs)
            .filter(([, job]) => job.result !== 'success')
            .map(([name, job]) => `${name}: ${job.result}`);

          if (failed.length > 0) {
            console.error(`Required CI jobs did not all pass: ${failed.join(', ')}`);
            process.exit(1);
          }

          console.log('Required CI jobs passed.');
          NODE
